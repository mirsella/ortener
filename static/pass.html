<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="img/chain.png">
    <title>password required</title>
  </head>
  <body>
    <div style="display: inline-block;">
      <h1 class="created" id="slug"></h1>
      <h1 class="created">short url required a password</h1>
    </div>
      <form name="form">
        <div class="form">
          <input class="input" type="text" name="passwd" id="passwd" placeholder=" ">
          <label class="label-name" for="name">
            <span class="content-name">password</span>
          </label>
        </div>

        <div class="button-container">
          <input type="submit" class="create">submit</input>
          <span class="bbt"></span>
          <span class="bbb"></span>
          <span class="bbr"></span>
          <span class="bbl"></span>
        </div>
      </form>
      <div v-if="error" class="error"></div>
      </div>
    </main>
  </body>
  <script charset="utf-8">
    const form = document.querySelector('form');
    const pass = document.querySelector('#passwd');
    const error = document.querySelector('.error');
    const slug = document.querySelector('#slug');
    const slugregex = /[a-zA-Z0-9]*$/
    const url = window.location.href;
    slug.innerHTML = url.match(slugregex)[0];
  </script>
</html>
