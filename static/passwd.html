<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="img/chain.png">
    <title>password required</title>
  </head>
  <body>
    <div>
      <h1 class="created" id="slug"></h1>
      <h1 class="created">short url required a password</h1>
    </div>
      <form name="form">
        <div class="form">
          <input class="input" type="password" name="passwd" id="passwd" placeholder=" " maxlength="100"></input>
          <label class="label-name" for="name">
            <span class="content-name">password</span>
          </label>
        </div>

        <div class="button-container">
          <input type="submit" class="create" value="submit"></input>
          <span class="bbt"></span>
          <span class="bbb"></span>
          <span class="bbr"></span>
          <span class="bbl"></span>
        </div>
      </form>
      <div v-if="error" class="error"></div>
      </div>
    </main>
  </body>
  <script charset="utf-8">
    const form = document.querySelector('form');
    const passwd = document.querySelector('#passwd');
    const error = document.querySelector('.error');
    const slug = document.querySelector('#slug');
    const slugregex = /\/([a-zA-Z0-9]*)($|\?passwd=)/gm
    const url = window.location.href;
    id = slugregex.exec(url)[1];
    slug.innerHTML = `"${id}"`

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      const response = await fetch(id + `?passwd=${passwd.value}`)
        .then(res => {
          if (e.status === 403 || e.status === 401) {
            error.innerHTML = "Incorrect password"
          } else if (e.status === 302) {
            window.location.href = id + `?passwd=${passwd.value}`
          }
        })
        .catch(e => error.innerHTML = e)
    })
  </script>
  <style type="text/css" media="screen">
    .created {
      display: inline-block;
      margin-right: 10px;
    }
    form {
      width: 60%;
    }
  </style>
</html>
